<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>缓存柱状图实时演示</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0D12;color:#E8EBEF;font:15px/1.6 -apple-system,sans-serif;padding:40px 20px}
.container{max-width:1000px;margin:0 auto}
h1{font-size:26px;margin-bottom:8px;color:#fff}
.subtitle{color:#6B7686;margin-bottom:30px;font-size:14px}
.panel{background:#0F131C;border:1px solid #1E2636;border-radius:12px;padding:24px;margin-bottom:20px}
.panel h2{font-size:16px;margin-bottom:16px;color:#B8C1D0;font-weight:500}
.terminal{font-family:"SF Mono",Monaco,monospace;font-size:18px;background:#05070C;
border:1px solid #161D2B;border-radius:8px;padding:16px;white-space:pre;line-height:2.2;
letter-spacing:.02em;margin-bottom:12px}
.controls{display:flex;gap:12px;margin-bottom:16px;align-items:center}
.btn{background:#1E2636;border:1px solid #2A3447;border-radius:6px;padding:8px 16px;
color:#B8C1D0;cursor:pointer;font:13px/1 monospace;transition:all .12s}
.btn:hover{background:#2A3447}
.btn.active{background:#254A5C;color:#7DD3E8;border-color:#2D5A6E}
.info{display:flex;gap:20px;font:12.5px/1.5 monospace;color:#6B7686;flex-wrap:wrap}
.info span{display:flex;gap:6px}
.info b{color:#9BA3B0;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.card{background:#05070C;border:1px solid #161D2B;border-radius:8px;padding:16px}
.card h3{font-size:13px;margin-bottom:10px;color:#8A94A4;font-weight:500}
.card .terminal{font-size:16px;margin:0;padding:12px}
.legend{background:#1A2332;border:1px solid #2A3447;border-radius:8px;padding:18px;
font:13px/1.8 monospace;color:#8A94A4;margin-top:20px}
.legend b{color:#B8C1D0}
</style>
</head>
<body>
<div class="container">
<h1>缓存柱状图 · 实时更新演示</h1>
<p class="subtitle">12 个 bucket × 5 分钟 = 60 分钟窗口。最右格实时累积，到达边界时离散左移。</p>

<div class="panel">
<h2>实时模拟</h2>
<div class="controls">
<button class="btn active" onclick="setSpeed(1)">1x</button>
<button class="btn" onclick="setSpeed(5)">5x</button>
<button class="btn" onclick="setSpeed(10)">10x</button>
<button class="btn" onclick="setSpeed(60)">60x</button>
<button class="btn" onclick="reset()">重置</button>
</div>
<div class="terminal" id="live"></div>
<div class="info">
<span>时间 <b id="time">--:--:--</b></span>
<span>边界 <b id="boundary">--:--:--</b></span>
<span>倒计时 <b id="countdown">--</b></span>
<span>整体 <b id="total-pct">--%</b></span>
<span>最右格 <b id="right-pct">--%</b></span>
</div>
</div>

<div class="grid">
<div class="card">
<h3>场景 A · 平稳高命中</h3>
<div class="terminal" id="scenario-a"></div>
</div>
<div class="card">
<h3>场景 B · 渐变恢复</h3>
<div class="terminal" id="scenario-b"></div>
</div>
<div class="card">
<h3>场景 C · 周期抖动</h3>
<div class="terminal" id="scenario-c"></div>
</div>
<div class="card">
<h3>场景 D · 急剧下滑</h3>
<div class="terminal" id="scenario-d"></div>
</div>
</div>

<div class="legend">
<b>八档色阶 (80-100%):</b><br>
▁ 80-82.5% · ▂ 82.5-85% · ▃ 85-87.5% · ▄ 87.5-90% ·
▅ 90-92.5% · ▆ 92.5-95% · ▇ 95-97.5% · █ 97.5-100%
</div>

</div>

<script>
const COLORS=['#F5C9B5','#E1CDBE','#CAD2C8','#B2D5D1','#ACDAD8','#BBE1DF','#C9E7E6','#D8EEED'];
const CHARS=['▁','▂','▃','▄','▅','▆','▇','█'];
const BS=300,NB=12;

let speed=1,now,history,timer;

function init(){
now=Math.floor(Date.now()/1000);
now=now-(now%BS);
history=[];
for(let i=0;i<NB-1;i++)history.push({r:1000,m:20});
history.push({r:0,m:0});
}

function setSpeed(s){
speed=s;
document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
}

function reset(){
init();
render();
}

function step(p){
if(p<=80)return 0;
let s=Math.floor((p-80)/2.5);
return Math.min(s,7);
}

function bar(bkts){
let out='',tr=0,tm=0;
for(let i=0;i<NB;i++){
const b=bkts[i];
tr+=(b?b.r:0);
tm+=(b?b.m:0);
if(!b||b.r===0){
out+=`<span style="color:${COLORS[0]}">${CHARS[0]}</span>`;
}else{
const p=((b.r-b.m)/b.r)*100;
const s=step(p);
out+=`<span style="color:${COLORS[s]}">${CHARS[s]}</span>`;
}
}
const tp=tr>0?((tr-tm)/tr*100).toFixed(0):0;
const rp=bkts[NB-1].r>0?((bkts[NB-1].r-bkts[NB-1].m)/bkts[NB-1].r*100).toFixed(0):0;
return{bar:out,tp,rp};
}

function render(){
now+=speed;
const end=Math.ceil(now/BS)*BS;
const start=end-NB*BS;

const dr=Math.floor(Math.random()*3)+1;
const dm=Math.random()<0.02?1:0;

const idx=Math.floor((now-start)/BS);
if(idx>=0&&idx<NB){
history[idx].r+=dr;
history[idx].m+=dm;
}

if(now>=end){
history.shift();
history.push({r:0,m:0});
}

const res=bar(history);
const t=new Date(now*1000).toISOString().substr(11,8);
const b=new Date(end*1000).toISOString().substr(11,8);
const c=end-now;

document.getElementById('live').innerHTML=
`<span style="color:#76ABAE">▲ </span><span style="color:#303841">hit </span><span style="color:#FF0000">${res.tp}%  </span>`+res.bar;
document.getElementById('time').textContent=t;
document.getElementById('boundary').textContent=b;
document.getElementById('countdown').textContent=c+'s';
document.getElementById('total-pct').textContent=res.tp+'%';
document.getElementById('right-pct').textContent=res.rp+'%';
}

function scene(id,data){
const bkts=data.map(p=>{
const r=100;
const m=Math.round(r*(100-p)/100);
return{r,m};
});
const res=bar(bkts);
document.getElementById(id).innerHTML=
`<span style="color:#76ABAE">▲ </span><span style="color:#303841">hit </span><span style="color:#FF0000">${res.tp}%  </span>`+res.bar;
}

init();
scene('scenario-a',[100,100,100,100,100,100,100,100,100,100,100,100]);
scene('scenario-b',[82,83,85,87,89,91,93,95,97,98,99,100]);
scene('scenario-c',[100,100,84,100,100,83,100,100,82,100,100,85]);
scene('scenario-d',[100,100,98,95,91,87,83,80,75,70,65,60]);

timer=setInterval(render,1000);
render();
</script>
</body>
</html>
